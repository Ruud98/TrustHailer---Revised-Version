# The test suite, on every push and every pull request.
#
# WHY THIS EXISTS
# Until now the only thing standing between a broken migration and `main` was
# somebody remembering to run the suite locally. That is fine right up until it
# is not: a hand-written migration, or a settings change that only production
# imports, fails in the one place nobody was looking. The runner builds its
# database from migrations on a clean machine, which is exactly the check a
# developer's own database — already migrated, already populated — cannot make.
#
# Dev settings, deliberately. They are what the suite is written against:
# SQLite, an insecure default SECRET_KEY, and no R2 or Postgres credentials to
# hand a public runner. `prod.py` raises on a missing SECRET_KEY by design, so
# it could not run here without stubbing the very things that make it
# production.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run's answer worthless, so
# it is cancelled rather than left to finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Pinned to the version the project actually runs on. Django 5.2 is
          # the earliest release that works here at all — see requirements.txt.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # Fails if a model was changed without a migration to match. Cheap, and
        # it catches the drift that only shows up on somebody else's checkout.
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite
        run: python manage.py test --verbosity 2
